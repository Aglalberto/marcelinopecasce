name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build com Astro
        uses: withastro/action@v6
        with:
          node-version: 22
        # Endereço temporário (aglalberto.github.io/marcelinopecasce) para validação.
        # Ao ligar o domínio marcelinopecasce.com.br, remova este bloco env.
        env:
          SITE_URL: https://aglalberto.github.io
          SITE_BASE: /marcelinopecasce/
          PUBLIC_SITE_PREVIEW: '1'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
